name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  # Lets a run be started by hand from the Actions tab, without an empty
  # commit — useful when a run needs retrying for a reason that has nothing
  # to do with the code.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      # Deliberately built with no Supabase environment variables set: the app
      # must build without secrets, because Vercel builds a preview before the
      # project's env vars are necessarily complete.
      - name: Build
        run: npm run build

  database:
    name: Migrations, tenant isolation, business rules
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4

      # Applies every migration to a throwaway database, then runs the tenant
      # isolation suite (PRD Section 10) and the Phase 1 acceptance criteria.
      # A single failed assertion fails the build.
      - name: Database tests
        run: ./scripts/test-db.sh
